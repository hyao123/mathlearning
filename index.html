<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="本地可用的小学奥数学习系统，按学习路线完成例题、闯关练习、每日一练和错题复习。" />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="小学奥数学习系统" />
    <meta property="og:description" content="先学典型题，再做闯关练习，自动记录错题，沿着路线从基础走到进阶。" />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light" />
    <title>小学奥数学习系统</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="student-shell">
      <aside class="student-sidebar" aria-label="学习导航">
        <div class="student-brand">
          <span class="student-brand__mark">数</span>
          <div>
            <p>二年级以上</p>
            <strong>数学路线</strong>
          </div>
        </div>

        <nav class="student-nav" aria-label="学生导航">
          <a href="#modules">路线</a>
          <a href="#lesson-panel" aria-current="page">当前题目</a>
          <a href="#daily-practice-panel">每日练习</a>
          <a href="#wrong-book">错题复习</a>
        </nav>

        <p class="student-sidebar__note">先看例题，再完成练习。答错的题会自动留下来。</p>
      </aside>

      <section class="student-workspace" aria-label="学习内容">
        <header class="workbench-header">
          <p class="eyebrow">今日学习</p>
          <h1>当前题目</h1>
          <p>按当前关卡练习，完成后再选择下一关。</p>
        </header>

        <section class="panel panel--main lesson-priority" id="lesson-panel">
          <div class="panel__header">
            <div>
              <p class="section-tag">当前关卡</p>
              <h2 id="module-title"></h2>
              <p id="module-description" class="muted"></p>
              <div id="module-grades" class="grade-tags"></div>
              <div id="module-route-context" class="route-context muted"></div>
            </div>
            <span class="badge" id="module-progress"></span>
          </div>

          <div class="subsection">
            <div class="subsection__header">
              <h3>先看 1 个例题</h3>
              <p class="muted">看懂方法就开始做题。</p>
            </div>
            <div id="examples"></div>
          </div>

          <div class="subsection">
            <div class="subsection__header">
              <h3>开始练习</h3>
              <p class="muted">做完一题，再看反馈。</p>
            </div>
            <div id="practice-list"></div>
          </div>
        </section>

        <section class="panel" id="daily-practice-panel">
          <div class="panel__header">
            <div>
              <p class="section-tag">今日任务</p>
              <h2>每日一练</h2>
              <p id="daily-practice-date" class="muted"></p>
            </div>
          </div>
          <div id="daily-practice-list" class="stack"></div>
        </section>

        <section class="panel panel--focus" id="wrong-book">
          <div class="panel__header">
            <div>
              <p class="section-tag">错题</p>
              <h2>再练一次</h2>
            </div>
            <button id="clear-wrong-book" class="button button--small button--ghost" type="button">
              清空
            </button>
          </div>
          <div id="wrong-book-list" class="stack"></div>
        </section>

        <section class="panel route-browser" id="modules">
          <div class="panel__header">
            <div>
              <p class="section-tag">路线</p>
              <h2>基础 → 进阶 → 挑战</h2>
            </div>
            <p class="panel__hint">从第 1 关开始，完成一关再进入下一关。</p>
          </div>
          <div class="grade-filter" id="grade-filter"></div>
          <div class="difficulty-filter" id="difficulty-filter"></div>
          <div class="module-grid" id="module-list"></div>
        </section>

        <div class="hero__stats" id="hero-stats" hidden></div>

        <details class="parent-tools" id="parent-tools">
        <summary>
          <span>
            <strong>家长工具</strong>
            <small>组卷、报告、备份放在这里</small>
          </span>
        </summary>

        <section class="panel" id="paper-generator-panel">
          <div class="panel__header">
            <div>
              <p class="section-tag">家长工具</p>
              <h2>随机组卷</h2>
              <p class="muted">按当前知识路线和难度范围生成一份练习卷。</p>
            </div>
          </div>
          <div class="paper-controls">
            <label class="muted" for="paper-count">题量</label>
            <select id="paper-count" class="paper-select">
              <option value="3">3 题</option>
              <option value="5" selected>5 题</option>
              <option value="8">8 题</option>
            </select>
            <button id="generate-paper" class="button button--primary" type="button">生成试卷</button>
            <button id="generate-wrong-paper" class="button button--ghost" type="button">错题重新组卷</button>
          </div>
          <div id="paper-generator-tip" class="muted"></div>
          <div id="paper-summary" class="stack"></div>
          <div id="paper-list" class="stack"></div>
        </section>

        <section class="panel" id="parent-dashboard">
          <div class="panel__header">
            <div>
              <p class="section-tag">学习概览</p>
              <h2>家长视图</h2>
            </div>
          </div>
          <div class="dashboard-grid" id="dashboard-cards"></div>
          <div class="dashboard-actions">
            <button id="export-report" class="button button--small button--ghost" type="button">导出学习报告</button>
            <button id="export-progress" class="button button--small button--ghost" type="button">备份进度</button>
            <button id="import-progress" class="button button--small button--ghost" type="button">恢复进度</button>
            <input id="import-progress-file" type="file" accept="application/json,.json" hidden />
          </div>
          <div id="recent-paper-summary" class="stack"></div>
          <div class="panel__divider"></div>
          <div id="mastery-ranking" class="stack"></div>
          <div class="panel__divider"></div>
          <div id="module-summary" class="stack"></div>
        </section>
        </details>
      </section>
    </main>

    <template id="example-template">
      <article class="card card--example">
        <div class="card__header">
          <h4 class="card__title"></h4>
          <span class="difficulty"></span>
        </div>
        <p class="card__question"></p>
        <button class="button button--small button--ghost answer-toggle" type="button">显示答案</button>
        <div class="answer-panel hidden">
          <p class="answer-text"></p>
          <p class="analysis-text muted"></p>
        </div>
      </article>
    </template>

    <template id="practice-template">
      <article class="card card--practice">
        <div class="card__header">
          <div>
            <h4 class="card__title"></h4>
            <p class="muted"></p>
          </div>
          <span class="difficulty"></span>
        </div>
        <p class="card__question"></p>
        <div class="answer-row">
          <input class="answer-input" type="text" placeholder="输入答案" />
          <button class="button button--small button--primary submit-answer" type="button">提交</button>
        </div>
        <p class="feedback hidden"></p>
      </article>
    </template>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
