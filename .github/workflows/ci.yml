name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Validate game content and human review
        run: npm run validate:release

      - name: Check shipped visual assets
        run: npm run check:visual-assets

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run check:bundle

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run smoke

      - name: Run game UI behavior test
        run: npm run test:game-ui

      - name: Run UI audit
        run: npm run audit:ui
